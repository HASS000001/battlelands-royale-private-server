# Nginx reverse proxy for the application and optional analytics UI.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy settings
geo $trusted_proxy {
    default         0;
    127.0.0.1       1;
    172.16.0.0/12   1;   # Docker bridge range
    10.0.0.0/8      1;
}

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/s;
limit_req_zone $binary_remote_addr zone=admin:10m  rate=30r/m;

# HTTP - redirect everything to HTTPS
server {
    listen 80;
    server_name _;

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $app_backend app:3000;
    set $metabase_backend metabase:3000;
    set $grafana_backend grafana:3000;

    # TLS
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options          "DENY"    always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;

    # Limits
    client_max_body_size 5m;
    keepalive_timeout    65;
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    # Game API endpoints (/Client/ + /Authentication/)
    location ~ ^/(Client|Authentication)/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass         http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }

    # WebSocket for Admin real-time dashboard
    location = /Admin/ws {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass         http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Admin UI + API
    location /Admin/ {
        limit_req zone=admin burst=30 nodelay;
        proxy_pass         http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Admin login rate-limit
    location = /Admin/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health / Metrics
    location = /health {
        proxy_pass http://$app_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        # Restrict metrics to internal only
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://$app_backend/metrics;
        proxy_set_header Host $host;
    }

    # Metabase analytics (at /metabase/)
    location /metabase/ {
        proxy_pass         http://$metabase_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Grafana monitoring UI
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass         http://$grafana_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Root -> redirect to Admin UI
    location = / {
        proxy_pass         http://$app_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /Admin {
        return 302 /Admin/ui;
    }
}
